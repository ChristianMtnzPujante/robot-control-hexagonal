# Mesa con un cubo y una lata que se pueden coger. Formato: «Escena» en la guía.
# Medidas para SIMULACIÓN: el robot atornillado a la mesa (tablero en z = 0).
# Para el robot real hay que medir la mesa y dónde se coloca cada cosa.

bodies:
  mesa:
    shape: box
    size: [1.1, 1.0, 0.05]
    position: [-0.35, -0.1, -0.025]
  cubo:                      # 5 cm: cabe de sobra en los 85 mm de la 2F-85
    shape: box
    size: [0.05, 0.05, 0.05]
    position: [-0.571, -0.141, 0.025]   # justo bajo la brida en pre_agarre
    graspable: true
  lata:
    shape: cylinder
    radius: 0.025
    height: 0.10
    position: [-0.45, -0.35, 0.05]
    graspable: true
    color: [0.15, 0.35, 0.85]

planes:
  mesa: {point: [0, 0, 0], normal: [0, 0, 1]}   # el tablero, donde apoya el robot

points:
  # El punto de partida del cubo girado -40° alrededor de la base, en la
  # zona libre de la mesa (lejos de la lata). Apoyado.
  destino: [-0.528, 0.259, 0.025]
