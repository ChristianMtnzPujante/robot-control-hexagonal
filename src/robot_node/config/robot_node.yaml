# Config declarativa de robot_node -- ver ros2_kit/node_config.py.
# Los valores por defecto de aquí son EXACTAMENTE los que antes estaban a
# mano en robot_node/node.py (mismo comportamiento, ahora en un archivo
# aparte). Los comentarios de cada parámetro también se han traído del
# código, no se han inventado de nuevo.

node:
  name: robot_node

parameters:
  robot_target:
    type: string
    default: simulado
  # Lista de nombres de articulación, EN ORDEN. Es un valor literal para
  # robot_node -- de dónde sale (a mano, o derivado de un URDF) es
  # decisión de quien lo lanza, no de este nodo (ver
  # ControlSession._resolve_joint_names en commander/control_session.py).
  joint_names:
    type: string_array
    default: [joint1, joint2, joint3, joint4, joint5, joint6]
  state_publish_period_seconds:
    type: double
    default: 0.05
    range: {min: 0.01, max: 5.0}
  # Nombre del dummy/objeto "tip" en la escena de CoppeliaSim, solo para
  # decoración visual (dejar un trail de waypoints). Vacío desactiva esa
  # decoración. No afecta a RobotConnectorPort.
  tip_name:
    type: string
    default: ""
  # Ruta a una escena .ttt de CoppeliaSim a cargar (y poner en play)
  # automáticamente al arrancar. Vacío asume que ya hay una escena cargada
  # y en play (comportamiento de siempre).
  scene_path:
    type: string
    default: ""
  # Puerto ZMQ del CoppeliaSim al que conectar -- permite tener varias
  # instancias de CoppeliaSim corriendo a la vez, cada una con su propia
  # ControlSession (ver commander/two_sessions_demo.py).
  zmq_port:
    type: int
    default: 23000
  # IP del controlador del CR5 físico -- solo se usa si robot_target="real".
  # Los DOS puertos TCP (comandos/dashboard y tiempo real -- ver #20, no
  # son tres como se asumió al principio) NO son configuración: son
  # constantes del protocolo del fabricante (ver adapters/_cr5_protocol.py).
  # Este valor por defecto ya se confirmó contra el robot físico real de
  # este proyecto (07/09, ver #112) -- pero seguirá siendo distinto en
  # cualquier otro despliegue, por eso sigue siendo parámetro y no constante.
  cr5_host:
    type: string
    default: "192.168.1.100"
  # cp de MovJ (suavizado entre waypoints, rango 0-100) -- solo se usa si
  # robot_target="real". Preferencia de ajuste de movimiento, no un dato
  # de seguridad (a diferencia de cr5_joint_limits_degrees, de abajo).
  # Mismo valor por defecto que Cr5RealRobotAdapter._DEFAULT_MOVJ_CP.
  cr5_movj_cp:
    type: int
    default: 50
    range: {min: 0, max: 100}
  # Límite articular EFECTIVO por joint, en grados (J1..J6, mismo orden
  # que joint_names) -- solo se usa si robot_target="real". El default de
  # aquí es el límite de FÁBRICA real del CR5 (ver
  # Cr5RealRobotAdapter._FACTORY_JOINT_LIMITS_DEGREES, verificado contra
  # tres fuentes oficiales) -- pedir aquí un valor MAYOR no tiene efecto:
  # Cr5RealRobotAdapter.__init__ toma el mínimo entre esto y el límite de
  # fábrica, joint a joint, así que este parámetro solo puede ESTRECHAR el
  # margen de seguridad (p. ej. para una sesión más cauta cerca de una
  # persona), nunca ampliarlo por encima del límite mecánico real -- un
  # typo o un override descuidado no puede desactivar la comprobación.
  # Un robot NUEVO (no el CR5) no reutiliza este parámetro tal cual: su
  # adaptador define su propio límite de fábrica -- ver la guía "Conectar
  # un Robot Nuevo" del vault.
  cr5_joint_limits_degrees:
    type: double_array
    default: [360.0, 360.0, 160.0, 360.0, 360.0, 360.0]

subscriptions:
  - topic: joint_command
    message_type: sensor_msgs/msg/JointState
    qos: 10
    callback: _on_joint_command
  - topic: goal
    message_type: geometry_msgs/msg/Pose
    qos: 10
    callback: _on_goal

publishers:
  - topic: joint_states
    message_type: sensor_msgs/msg/JointState
    qos: 10

timers:
  - period_parameter: state_publish_period_seconds
    callback: _publish_state
